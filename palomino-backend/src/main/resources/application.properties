# URL de la base de datos (asegúrate de que el nombre palomino_crm exista en MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/bd_palomino?useSSL=false&serverTimezone=UTC

# Tu usuario y contraseña de MySQL (por defecto suele ser root)
spring.datasource.username=root
spring.datasource.password=root

# Driver de conexión
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración para que Spring cree las tablas solo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
